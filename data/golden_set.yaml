# GOLDEN SET: 30 conversations. Each entry has `reviewed_by_human: true`.
# This file is the ground truth the judges and checks use.
#
# Conventions
#  - must_include: facts a good summary must convey (semantically). `critical: true` = missing/wrong => critical failure.
#  - literal_anchors: strings that must appear verbatim in the summary (normalised: case, spaces, commas, currency
#    symbols ignored). "a|b" = either spelling is acceptable. Only IDs, amounts and short fixed dates are anchored;
#    everything else is judged semantically. A validator (src/golden.py) checks anchors occur in the conversation.
#  - must_not_include `type`: pii | hallucination | injection  => critical;  tone | language | noise | speculation => non-critical.
#  - literal_patterns: python regexes (case-insensitive) that must NOT match the summary (deterministic hook).
#  - expected_status: open | resolved | pending_customer | escalated | no_action
# Selection rationale for the 30 and the 16 left out: docs/golden_set_selection.md

- id: T36
  primary_slice: baseline
  tags: [baseline, tracking_number, resolved]
  why_included: "Clean, resolved, two precise IDs. Both versions should pass; catches catastrophic breakage. Also tests H6: does v2 invent a 'Next step' for a closed case?"
  must_include:
    - {id: M1, fact: "Replacement for order LM-51620 has shipped", critical: true, literal_anchors: ["LM-51620"]}
    - {id: M2, fact: "Tracking number LMT-7782-991-IN (the customer asked for it)", critical: true, literal_anchors: ["LMT-7782-991-IN"]}
    - {id: M3, fact: "Expected delivery in 3 days", critical: false}
  must_not_include:
    - {id: N1, item: "Invents a problem or a follow-up action for the next agent", type: hallucination}
  expected_status: resolved
  reviewed_by_human: true

- id: T19
